name: ci

on:
  push:

env:
  MAJOR: 0
  MINOR: 3
  PATCH: 1

permissions:
  contents: write

jobs:
  test-typescript:
    name: TypeScript Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        id: setup-node
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install Dependencies
        id: npm-ci
        run: npm ci

      - name: Check Format
        id: npm-format-check
        run: npm run format:check

      - name: Lint
        id: npm-lint
        run: npm run lint

      - name: Test
        id: npm-ci-test
        run: npm run ci-test

  test-action:
    name: GitHub Actions Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v5

      - name: Test Local Action (with Token)
        id: outdated-git-cleanup-action-token
        uses: ./
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Test Local Action (without Token)
        id: outdated-git-cleanup-action-no-token
        uses: ./

  version:
    name: Version
    runs-on: ubuntu-latest
    needs: [test-typescript, test-action]

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Compute semantic version
        id: semantic_version
        uses: KinNeko-De/compute-semantic-version-action@v1
        with:
          major: ${{ env.MAJOR }}
          minor: ${{ env.MINOR }}
          patch: ${{ env.PATCH }}

      - name: Prepare git tags
        id: prepare_tag
        run: |
          echo "git_tag=v${{ steps.semantic_version.outputs.semantic_version }}" >> $GITHUB_OUTPUT
          echo "git_tag_major=v${{ env.MAJOR }}" >> $GITHUB_OUTPUT

      - name:
          Move major version  ${{ steps.prepare_tag.outputs.git_tag_major }} tag
        if:
          github.ref == format('refs/heads/{0}',
          github.event.repository.default_branch)
        uses: actions/github-script@v7
        env:
          majorTag: ${{ steps.prepare_tag.outputs.git_tag_major }}
        with:
          script: |
            const majorTag = process.env.majorTag;

            core.debug("Delete the major tag ")
            try {
              await github.rest.git.deleteRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `tags/${majorTag}`
              });
              core.debug(`Deleted existing tag ${majorTag}`);
            } catch (err) {
              core.info(`Tag ${majorTag} did not exist or could not be deleted: ${err.message}`);
            }

            core.debug(`Create the major tag at the current commit`);
            await github.rest.git.createRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `refs/tags/${majorTag}`,
              sha: context.sha
            });
            core.info(`Created tag ${majorTag} at ${context.sha}`);

      - name: Create semantic versioning git tag
        uses: actions/github-script@v8
        with:
          script: |
            // Attempt to create the desired tag; if it already exists, increment patch until a free tag is found
            const desired = `${{ steps.prepare_tag.outputs.git_tag }}`; // e.g. v0.3.1
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const sha = context.sha;

            core.debug(`Desired tag: ${desired}`);

            function parseSemver(tag) {
              const m = /^v(\d+)\.(\d+)\.(\d+)$/.exec(tag);
              if (!m) return null;
              return { major: Number(m[1]), minor: Number(m[2]), patch: Number(m[3]) };
            }

            async function tryCreate(tag) {
              try {
                await github.rest.git.createRef({ owner, repo, ref: `refs/tags/${tag}`, sha });
                core.info(`Created tag ${tag}`);
                return true;
              } catch (err) {
                // If reference exists, GitHub returns 422
                if (err.status === 422 || (err.message && err.message.includes('Reference already exists'))) {
                  core.info(`Tag ${tag} already exists`);
                  return false;
                }
                throw err;
              }
            }

            const parsed = parseSemver(desired);
            if (!parsed) {
              // Not a simple semver tag, just try once and let errors surface
              await github.rest.git.createRef({ owner, repo, ref: `refs/tags/${desired}`, sha });
              core.info(`Created tag ${desired}`);
            } else {
              // Try desired tag, otherwise increment patch until success (limit to 100 tries)
              if (await tryCreate(desired)) return;
              const maxTries = 100;
              for (let i = 1; i <= maxTries; i++) {
                const candidate = `v${parsed.major}.${parsed.minor}.${parsed.patch + i}`;
                if (await tryCreate(candidate)) return;
              }
              throw new Error(`Could not create a unique tag after ${maxTries} attempts`);
            }
