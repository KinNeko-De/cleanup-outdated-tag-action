name: ci

on:
  push:

env:
  MAJOR: 0
  MINOR: 3
  PATCH: 1

permissions:
  contents: write

jobs:
  test-typescript:
    name: TypeScript Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        id: setup-node
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install Dependencies
        id: npm-ci
        run: npm ci

      - name: Check Format
        id: npm-format-check
        run: npm run format:check

      - name: Lint
        id: npm-lint
        run: npm run lint

      - name: Test
        id: npm-ci-test
        run: npm run ci-test

  test-action:
    name: GitHub Actions Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v6

      - name: Test Local Action (with Token)
        id: outdated-git-cleanup-action-token
        uses: ./
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Test Local Action (without Token)
        id: outdated-git-cleanup-action-no-token
        uses: ./

  version:
    name: Version
    runs-on: ubuntu-latest
    needs: [test-typescript, test-action]

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Compute semantic version
        id: semantic_version
        uses: KinNeko-De/compute-semantic-version-action@v1
        with:
          major: ${{ env.MAJOR }}
          minor: ${{ env.MINOR }}
          patch: ${{ env.PATCH }}

      - name: Prepare git tags
        id: prepare_tag
        run: |
          echo "git_tag=v${{ steps.semantic_version.outputs.semantic_version }}" >> $GITHUB_OUTPUT
          echo "git_tag_major=v${{ env.MAJOR }}" >> $GITHUB_OUTPUT

      - name: 'Version upgraded?'
        id: version_check
        run: |
          current_version="v${{ steps.semantic_version.outputs.next_default_branch_version }}"
          last_main_version=$(git tag --list | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)
          if [[ -z "$last_main_version" ]]; then
            echo "No previous version found, proceeding..."
          else
            echo "Compare last main version: $last_main_version with current version: $current_version"
            if [[ $(echo -e "$current_version\n$last_main_version" | sort -V | head -n 1) == "$current_version" ]]; then
              echo "Please upgrade the version number to a higher value than $last_main_version"
              exit 1
            fi
          fi

      - name:
          Move major version  ${{ steps.prepare_tag.outputs.git_tag_major }} tag
        if:
          github.ref == format('refs/heads/{0}',
          github.event.repository.default_branch)
        uses: actions/github-script@v7
        env:
          majorTag: ${{ steps.prepare_tag.outputs.git_tag_major }}
        with:
          script: |
            const majorTag = process.env.majorTag;

            core.debug("Delete the major tag ")
            try {
              await github.rest.git.deleteRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `tags/${majorTag}`
              });
              core.debug(`Deleted existing tag ${majorTag}`);
            } catch (err) {
              core.info(`Tag ${majorTag} did not exist or could not be deleted: ${err.message}`);
            }

            core.debug(`Create the major tag at the current commit`);
            await github.rest.git.createRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `refs/tags/${majorTag}`,
              sha: context.sha
            });
            core.info(`Created tag ${majorTag} at ${context.sha}`);

      - name:
          'Create semantic versioning git tag ${{
          steps.prepare_tag.outputs.git_tag }}'
        uses: actions/github-script@v8
        with:
          script: |
            github.rest.git.createRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: "refs/tags/${{steps.prepare_tag.outputs.git_tag }}",
              sha: context.sha
            })
