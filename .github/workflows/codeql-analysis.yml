name: CodeQL

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  # The scheduled CodeQL run is commented out because GitHub disables scheduled
  # workflows for repositories that have had no activity for 60+ days and will also not start the workflow for a pull request.
  # Remove the comment lines below to re-enable the automatic
  # weekly scan.
  # schedule:
  #   - cron: '31 7 * * 3'

permissions:
  actions: read
  checks: write
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        language:
          - TypeScript

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v6

      - name: Initialize CodeQL
        id: initialize
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          source-root: src

      - name: Autobuild
        id: autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis
        id: analyze
        uses: github/codeql-action/analyze@v4
